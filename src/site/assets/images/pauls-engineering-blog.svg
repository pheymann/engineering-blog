  <defs>
    <clipPath id="paul-letters">
      <text x="9" y="111" font-family="Arial Black, Arial, sans-serif" font-size="132" font-weight="900">Paul's</text>
    </clipPath>
  </defs>
  <g clip-path="url(#paul-letters)">
